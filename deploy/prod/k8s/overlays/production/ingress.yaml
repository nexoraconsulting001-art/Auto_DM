# The platform hosts. With Cloudflare in front, TLS from the visitor ends at Cloudflare and Cloudflare reaches this
# Ingress over TLS with an origin certificate held in the Secret bhava-origin-tls (runbooks/dns-and-cutover.md).
# Sellers' own domains reach the default backend in the base.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bhava
spec:
  ingressClassName: set-me
  tls:
    - hosts:
        - example.com
        - "*.example.com"
      secretName: bhava-origin-tls
  rules:
    - host: example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bhava-web
                port:
                  name: http
    - host: "*.example.com"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bhava-web
                port:
                  name: http
