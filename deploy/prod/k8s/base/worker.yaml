# The worker: background jobs. Its health answers on WORKER_HEALTH_PORT (3001) on every address, so the kubelet can
# reach it (WORKER_HEALTH_HOST=0.0.0.0 in bhava-config). On SIGTERM it finishes or releases its jobs.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bhava-worker
  labels:
    app.kubernetes.io/name: bhava
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bhava
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bhava
        app.kubernetes.io/component: worker
        bhava.app/data-client: "true"
      annotations:
        bhava.app/config-version: "0"
    spec:
      serviceAccountName: bhava
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: bhava-worker
          imagePullPolicy: IfNotPresent
          command: ["node", "src/worker.js"]
          ports:
            - name: health
              containerPort: 3001
          envFrom:
            - configMapRef:
                name: bhava-config
          env:
            - name: NODE_OPTIONS
              value: --max-old-space-size=512
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /startupz
              port: health
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 90
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "2"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: secrets
          secret:
            secretName: bhava-secrets
            defaultMode: 0400
