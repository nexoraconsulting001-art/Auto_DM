# Web scales on load (CPU, with memory as a guard). Never fewer than two, so one pod can always be replaced.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bhava-web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bhava-web
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
---
# The worker scales on queue depth: queue_jobs{status="waiting"} from src/contracts/metrics.js, served to the
# autoscaler as an external metric by the cluster's metrics adapter (any Prometheus adapter; see runbooks/scaling.md).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bhava-worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bhava-worker
  minReplicas: 1
  maxReplicas: 6
  metrics:
    - type: External
      external:
        metric:
          name: queue_jobs
          selector:
            matchLabels:
              status: waiting
        target:
          type: AverageValue
          averageValue: "200"
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
