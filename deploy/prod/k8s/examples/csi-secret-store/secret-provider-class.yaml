# EXAMPLE ONLY: not part of any kustomization and not checked by kubeconform (its kind comes from a CRD).
#
# The other way to bring secrets from an outside manager: the Secrets Store CSI driver mounts them straight into the
# pod as files, one per setting, with no Kubernetes Secret in between. To use it, replace the `secrets` volume of the
# web, worker, backup and migration pods with:
#
#   - name: secrets
#     csi:
#       driver: secrets-store.csi.k8s.io
#       readOnly: true
#       volumeAttributes:
#         secretProviderClass: bhava-secrets
#
# `provider` and `parameters` belong to the chosen cloud's CSI provider plugin; the values below are placeholders.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: bhava-secrets
spec:
  provider: set-me-provider
  parameters:
    objects: |
      - objectName: bhava/production/DATABASE_URL
        objectAlias: DATABASE_URL
      - objectName: bhava/production/DATABASE_OWNER_URL
        objectAlias: DATABASE_OWNER_URL
      - objectName: bhava/production/DATA_KEY
        objectAlias: DATA_KEY
