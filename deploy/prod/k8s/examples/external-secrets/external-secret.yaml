# EXAMPLE ONLY: not part of any kustomization and not checked by kubeconform (its kinds come from a CRD).
#
# Fills the Secret bhava-secrets from an outside secret manager through the External Secrets Operator
# (external-secrets.io), so the pods mount it exactly as they mount a Secret made by hand: one file per setting,
# read with SECRETS_DRIVER=file. The store (a ClusterSecretStore) is whatever the chosen cloud's secret manager,
# or a self-hosted one, offers; its name here is a placeholder, and so is the key prefix.
#
# Apply after the operator is installed:  kubectl apply -n bhava -f external-secret.yaml
# Each setting is one remote key named as the setting under the prefix (bhava/production/DATA_KEY, ...).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: bhava-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: set-me-secret-store
  target:
    name: bhava-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: DATABASE_URL
      remoteRef: { key: bhava/production/DATABASE_URL }
    - secretKey: DATABASE_OWNER_URL
      remoteRef: { key: bhava/production/DATABASE_OWNER_URL }
    - secretKey: REDIS_URL
      remoteRef: { key: bhava/production/REDIS_URL }
    - secretKey: CLICKHOUSE_URL
      remoteRef: { key: bhava/production/CLICKHOUSE_URL }
    - secretKey: S3_ACCESS_KEY_ID
      remoteRef: { key: bhava/production/S3_ACCESS_KEY_ID }
    - secretKey: S3_SECRET_ACCESS_KEY
      remoteRef: { key: bhava/production/S3_SECRET_ACCESS_KEY }
    - secretKey: BACKUP_S3_ACCESS_KEY_ID
      remoteRef: { key: bhava/production/BACKUP_S3_ACCESS_KEY_ID }
    - secretKey: BACKUP_S3_SECRET_ACCESS_KEY
      remoteRef: { key: bhava/production/BACKUP_S3_SECRET_ACCESS_KEY }
    - secretKey: DATA_KEY
      remoteRef: { key: bhava/production/DATA_KEY }
    - secretKey: SESSION_SECRET
      remoteRef: { key: bhava/production/SESSION_SECRET }
    - secretKey: APP_SECRET
      remoteRef: { key: bhava/production/APP_SECRET }
    - secretKey: VERIFY_TOKEN
      remoteRef: { key: bhava/production/VERIFY_TOKEN }
    - secretKey: METRICS_TOKEN
      remoteRef: { key: bhava/production/METRICS_TOKEN }
  # The provider secrets (FB_APP_SECRET, RAZORPAY_*, SHIPROCKET_*, WHATSAPP_*, ...) follow the same pattern; or take
  # every key under the prefix at once:
  dataFrom:
    - find:
        path: bhava/production
        name:
          regexp: "^[A-Z0-9_]+$"
      rewrite:
        - regexp:
            source: "bhava/production/(.*)"
            target: "$1"
