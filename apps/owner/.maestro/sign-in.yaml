# Runs on an emulator in .github/workflows/apps.yml (android-e2e), against the job's own server and simulators
# (support/server.mjs). A flow's `name` counts toward a requirement when it starts with that requirement's id
# (tools/gate-lib.mjs); the gate does not run flows, CI does.
appId: ${APP_ID}
name: 'P-11: Sign in with a WhatsApp code from Bhava; there is no password field and no SMS option'
tags:
  - smoke
---
- launchApp:
    clearState: true
    permissions:
      notifications: allow
- extendedWaitUntil:
    visible:
      id: sign-in-whatsapp
    timeout: 120000
- assertVisible: Sign in to Bhava for Business
- assertVisible:
    id: sign-in-google
- assertNotVisible: .*[Pp]assword.*
- assertNotVisible: .*SMS.*
- runFlow:
    file: common/sign-in-with-code.yaml
    env:
      PHONE: ${PHONE_SIGN_IN}
- assertVisible:
    id: open-switcher
- assertVisible: .*${BUSINESS_A_NAME}.*
- assertNotVisible: .*[Pp]assword.*
