# Shared steps, run from a flow with runFlow (Maestro runs only the flows at the top of .maestro). Opens the app with
# nothing stored, signs PHONE in with the WhatsApp code the job's server sent to the WhatsApp simulator, says "Not now"
# to face unlock if it is offered, and waits for the signed-in app.
appId: ${APP_ID}
name: Sign in with a WhatsApp code (shared steps)
---
- launchApp:
    clearState: true
    permissions:
      notifications: allow
- extendedWaitUntil:
    visible:
      id: sign-in-whatsapp
    timeout: 120000
- tapOn:
    id: sign-in-whatsapp
- tapOn:
    id: sign-in-phone
- inputText: ${PHONE}
- hideKeyboard
- tapOn:
    id: sign-in-send
- extendedWaitUntil:
    visible:
      id: sign-in-code
    timeout: 30000
- runScript:
    file: ../support/code.js
    env:
      PHONE: ${PHONE}
      SIM_WHATSAPP_URL: ${SIM_WHATSAPP_URL}
- tapOn:
    id: sign-in-code
- inputText: ${output.code}
- hideKeyboard
- tapOn:
    id: sign-in-verify
- extendedWaitUntil:
    visible:
      id: top-bar|lock-offer
    timeout: 60000
- runFlow:
    when:
      visible:
        id: lock-offer
    commands:
      - tapOn:
          id: lock-offer-no
- extendedWaitUntil:
    visible:
      id: top-bar
    timeout: 30000
