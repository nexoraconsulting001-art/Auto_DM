# A DM-style link opens the app on the product itself, on the business's own link scheme: a direct link, nothing in between.
appId: ${APP_ID}
name: 'Q-11 - A link from a message opens the seeded product in the app'
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: tab-home
    timeout: 120000
- openLink: ${APP_SCHEME}://p/${PRODUCT_SLUG}
- extendedWaitUntil:
    visible:
      id: product-name
    timeout: 30000
- assertVisible: ${PRODUCT_NAME}
- assertNotVisible:
    id: screen-sign-in
