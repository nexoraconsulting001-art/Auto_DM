# Browsing never asks for notifications. After the first order the store's own words come first, then the phone's prompt.
appId: ${APP_ID}
name: 'P-46: Notifications are asked for only after the first order, in the store''s own words'
---
- runFlow:
    file: common/sign-in.yaml
    env:
      SHOPPER_PHONE: ${SHOPPER_PHONE}
      SIM_WHATSAPP_URL: ${SIM_WHATSAPP_URL}
- assertNotVisible:
    id: notification-explainer
- tapOn:
    id: tab-catalog
- runFlow:
    file: common/to-checkout.yaml
    env:
      PRODUCT_SLUG: ${PRODUCT_SLUG}
      PRODUCT_NAME: ${PRODUCT_NAME}
      SHOPPER_NAME: ${SHOPPER_NAME}
      SHOPPER_PHONE: ${SHOPPER_PHONE}
      SHOPPER_LINE1: ${SHOPPER_LINE1}
      SHOPPER_CITY: ${SHOPPER_CITY}
      SHOPPER_PINCODE: ${SHOPPER_PINCODE}
      SHOPPER_STATE_CODE: ${SHOPPER_STATE_CODE}
      SHOPPER_EMAIL: ${SHOPPER_EMAIL}
      SIM_WHATSAPP_URL: ${SIM_WHATSAPP_URL}
      SIM_RAZORPAY_URL: ${SIM_RAZORPAY_URL}
- runFlow:
    when:
      visible:
        id: addr-name
    file: common/address.yaml
    env:
      PRODUCT_SLUG: ${PRODUCT_SLUG}
      PRODUCT_NAME: ${PRODUCT_NAME}
      SHOPPER_NAME: ${SHOPPER_NAME}
      SHOPPER_PHONE: ${SHOPPER_PHONE}
      SHOPPER_LINE1: ${SHOPPER_LINE1}
      SHOPPER_CITY: ${SHOPPER_CITY}
      SHOPPER_PINCODE: ${SHOPPER_PINCODE}
      SHOPPER_STATE_CODE: ${SHOPPER_STATE_CODE}
      SHOPPER_EMAIL: ${SHOPPER_EMAIL}
      SIM_WHATSAPP_URL: ${SIM_WHATSAPP_URL}
      SIM_RAZORPAY_URL: ${SIM_RAZORPAY_URL}
- runFlow:
    file: common/place-cod.yaml
    env:
      PRODUCT_SLUG: ${PRODUCT_SLUG}
      PRODUCT_NAME: ${PRODUCT_NAME}
      SHOPPER_NAME: ${SHOPPER_NAME}
      SHOPPER_PHONE: ${SHOPPER_PHONE}
      SHOPPER_LINE1: ${SHOPPER_LINE1}
      SHOPPER_CITY: ${SHOPPER_CITY}
      SHOPPER_PINCODE: ${SHOPPER_PINCODE}
      SHOPPER_STATE_CODE: ${SHOPPER_STATE_CODE}
      SHOPPER_EMAIL: ${SHOPPER_EMAIL}
      SIM_WHATSAPP_URL: ${SIM_WHATSAPP_URL}
      SIM_RAZORPAY_URL: ${SIM_RAZORPAY_URL}
- extendedWaitUntil:
    visible:
      id: notification-explainer
    timeout: 30000
- tapOn:
    id: explainer-yes
- extendedWaitUntil:
    notVisible:
      id: notification-explainer
    timeout: 30000
- tapOn:
    id: tab-account
- tapOn:
    id: row-notifications
- assertVisible:
    id: screen-notifications
